services:
  hassgram:
    image: lordraw/hassgram:latest
    container_name: hassgram
    restart: unless-stopped
    env_file: .env
    # Or, instead of env_file, set them one by one:
    # environment:
    #   HOME_ASSISTANT_API_URL: http://homeassistant.local:8123/api/
    #   HOME_ASSISTANT_API_ACCESS_TOKEN: <long-lived access token>
    #   TELEGRAM_BOT_TOKEN: <token from @BotFather>
    #   TELEGRAM_CHAT_ID: "123456789"
    #   BOT_LANGUAGE: it
